name: Build and push Docker images

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: saleor-app-avatax
            app_path: avatax
          - app_name: saleor-app-cms
            app_path: cms
          - app_name: saleor-app-cms-v2
            app_path: cms-v2
          - app_name: saleor-app-data-importer
            app_path: data-importer
          - app_name: saleor-app-klaviyo
            app_path: klaviyo
          - app_name: saleor-app-payment-np-atobarai
            app_path: np-atobarai
          - app_name: saleor-app-products-feed
            app_path: products-feed
          - app_name: saleor-app-search
            app_path: search
          - app_name: saleor-app-segment
            app_path: segment
          - app_name: saleor-app-smtp
            app_path: smtp
          - app_name: saleor-app-payment-stripe
            app_path: stripe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/saleor-apps-${{ matrix.app_path }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.title=saleor-apps-${{ matrix.app_path }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.production
          push: ${{ github.event_name != 'pull_request' }}
          # Add linux/arm64 when needed; emulation can slow builds
          platforms: linux/amd64
          build-args: |
            APP_PATH=${{ matrix.app_path }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
